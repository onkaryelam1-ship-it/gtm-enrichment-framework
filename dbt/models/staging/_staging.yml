version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: domain
        data_tests: [unique, not_null]
  - name: stg_contacts
    description: Raw contacts, standardized. Duplicates and bad records are still present.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: ["IC", "Manager", "Director", "VP", "C-level"]
  - name: stg_enrichment
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: provider
        data_tests:
          - accepted_values:
              arguments:
                values: ["clay", "mock"]
